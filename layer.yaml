# agent-layerz builds its own agent configuration with alz.
stack:
  - source: github:gautamr/agent-layerz-personal@v0.5.0 # the public personal layer
  - source: path:./.layer # this repository's layer
targets: [claude]
mcp:
  enable: [backlog]
budgets:
  instructions_max_lines: 200
options:
  commit_generated: true
  strict_slots: true
