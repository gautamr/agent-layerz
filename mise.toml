[tools]
node = "22"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.test]
description = "Run the acceptance and unit tests"
run = "npm test"

[tasks.lint]
description = "Biome check and TypeScript type check"
run = "npm run lint"

[tasks.build]
description = "Type check and bundle the CLI to dist/cli.js"
run = "npm run build"

[tasks."test:node24"]
description = "Run the tests on the newest supported Node line too"
run = "mise x node@24 -- npm test"

[tasks."install:local"]
description = "Build alz as one self-contained file and install it to ~/.local/bin/alz (PREFIX or BIN_DIR to change)"
run = "sh scripts/install-local.sh"

[tasks."alz:build"]
description = "Rebuild this repo's agent config with the current code (dogfooding)"
run = "npm run -s build && node dist/cli.js build"

[tasks."alz:check"]
description = "Fail if this repo's generated agent config is out of date"
run = "npm run -s build && node dist/cli.js check"

[tasks."alz:ls"]
description = "List this repo's agents, skills, rules, hooks and MCP servers by layer"
run = "npm run -s build && node dist/cli.js ls"
