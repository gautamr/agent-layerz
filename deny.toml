# cargo-deny policy for the Rust workspace (supply chain: advisories, licences, bans, sources).
# Run with `mise run rust:deny`. cargo-deny is a pinned tool in mise.toml, not a Cargo dependency.

[graph]
# Check every target and every feature: the shipped binaries cover macOS and Linux (decision-25),
# and a dependency that only appears on one target is still shipped.
all-features = true

[advisories]
version = 2
# Fail on advisories of any kind, unmaintained and unsound crates included, and on yanked crates.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Each entry needs an id and a reason. None are accepted today.
ignore = []

[licenses]
version = 2
# This project is MIT; everything it ships must be compatible with distribution under MIT.
# Add a licence only after reading it, with the crate that needs it in a comment.
allow = [
    "MIT",
    "Apache-2.0",       # clap and its helper crates, alongside MIT
    "Unicode-3.0",      # unicode-ident data tables
]
confidence-threshold = 0.93

# decision-28 (amended 2026-11-23): serde-saphyr's `deserialize` feature brings in encoding_rs,
# licensed `(Apache-2.0 OR MIT) AND BSD-3-Clause`; the BSD-3-Clause part covers its WHATWG encoding
# data. BSD-3-Clause stays disallowed for every other crate, so none can bring it in unnoticed.
[[licenses.exceptions]]
name = "encoding_rs"
allow = ["BSD-3-Clause"]

[bans]
# One version of each crate in the graph. A duplicate doubles compile time and binary size and
# often hides a stale transitive dependency. When an unavoidable duplicate appears, record it in
# `skip` with the reason and the crate that forces it.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = []

# Version rules recorded in decisions. They apply from the day a crate enters the graph.
#
# A requirement such as `<1.1.6` never matches a pre-release (semver: a pre-release matches only a
# requirement that names a pre-release of the same major.minor.patch). cargo-deny 0.22 confirmed
# this on a scratch graph (TASK-55.1.4 notes): `rustix 1.1.5-rc.1`, `serde-saphyr 2.2.0-rc.1` and
# `serde-saphyr 2.2.1-rc.1` passed the plain bounds. Each bound therefore has a twin that opts in to
# pre-releases of the boundary version, written `>=X.Y.Z-0, <X.Y.Z` or `>=X.Y.Z-0`. cargo-deny
# cannot say "any pre-release", so pre-releases of other versions stay out of reach here; Cargo.toml
# keeps them out, because cargo selects a pre-release only for a requirement that names one.
deny = [
    # decision-27: earlier rustix releases lack the fixes alz relies on for no-follow directory walks.
    { name = "rustix", version = "<1.1.6", reason = "decision-27 requires rustix 1.1.6 or later" },
    { name = "rustix", version = ">=1.1.6-0, <1.1.6", reason = "decision-27 requires rustix 1.1.6 or later; this catches its pre-releases" },
    # decision-27: only alz-io calls rustix. `wrappers` lets named crates depend on it directly and
    # fails any other direct dependent. Add a crate here only when it appears in the graph, with the
    # reason. cargo-deny prints a warning for a wrapper it does not meet; that is expected until
    # tempfile joins the graph.
    { name = "rustix", wrappers = ["alz-io", "tempfile"], reason = "decision-27: only alz-io depends on rustix; tempfile is the named third-party exception" },
    # decision-28: serde-saphyr is pinned exactly. Raise the pin in Cargo.toml and every line here together.
    { name = "serde-saphyr", version = "<2.2.0", reason = "decision-28 pins serde-saphyr to =2.2.0" },
    { name = "serde-saphyr", version = ">=2.2.0-0, <2.2.0", reason = "decision-28 pins serde-saphyr to =2.2.0; this catches the pre-releases of 2.2.0" },
    { name = "serde-saphyr", version = ">2.2.0", reason = "decision-28 pins serde-saphyr to =2.2.0" },
    { name = "serde-saphyr", version = ">=2.2.1-0", reason = "decision-28 pins serde-saphyr to =2.2.0; this catches the pre-releases of 2.2.1" },
]

# decision-32: serde's `derive` feature stays off, so no type in the workspace derives `Serialize` or
# `Deserialize` and feature unification from another crate cannot turn it on unnoticed.
[[bans.features]]
crate = "serde"
deny = ["derive"]

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
