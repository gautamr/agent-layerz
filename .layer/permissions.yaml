allow:
  - "bash:mise run *"
  - "bash:npm test*"
  - "bash:npm run *"
  - "bash:npx vitest *"
  - "bash:npx tsc *"
  - "bash:npx biome *"
  - "bash:node dist/cli.js *"
  - "bash:backlog *"
  - "bash:git status*"
  - "bash:git diff*"
  - "bash:git log*"
# Releases come only from CI with trusted publishing.
deny:
  - "bash:npm publish*"
  - "bash:npm unpublish*"
  - "bash:npm deprecate*"
  - "bash:npm dist-tag*"
  - "bash:npm token*"
  - "bash:npm login*"
