allow:
  - "bash:mise run *"
  - "bash:backlog *"
  - "bash:git status*"
  - "bash:git diff*"
  - "bash:git log*"
# Releases come only from CI. The npm rules stay while the npm package exists: deny rules only get stricter.
deny:
  - "bash:npm publish*"
  - "bash:npm unpublish*"
  - "bash:npm deprecate*"
  - "bash:npm dist-tag*"
  - "bash:npm token*"
  - "bash:npm login*"
  - "bash:cargo publish*"
  - "bash:cargo yank*"
  - "bash:cargo owner*"
  - "bash:cargo login*"
