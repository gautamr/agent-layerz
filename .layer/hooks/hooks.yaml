# Generated files are rebuilt from .layer/; stop agents from hand-editing them.
- id: protect-generated
  event: pre_tool
  match:
    tools: [edit, write]
    paths:
      [
        "AGENTS.md",
        "CLAUDE.md",
        ".claude/agents/**",
        ".claude/skills/**",
        ".claude/rules/**",
        ".claude/settings.json",
        ".mcp.json",
        "layer.lock",
        "dist/**",
      ]
  command: 'echo "Generated by alz: edit .layer/ and run mise run alz:build instead." >&2; exit 2'
  on_fail: deny
# An agent is not done while lint or tests fail.
- id: verify-on-stop
  event: stop
  command: 'cd "${PROJECT_DIR}" && { npm run -s lint >&2 && npx vitest run >&2; } || exit 2'
  timeout: 300
