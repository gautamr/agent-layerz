# Generated files are rebuilt from .layer/; stop agents from hand-editing them.
- id: protect-generated
  event: pre_tool
  match:
    tools: [edit, write]
    paths:
      [
        "AGENTS.md",
        "CLAUDE.md",
        ".claude/agents/**",
        ".claude/skills/**",
        ".claude/rules/**",
        ".claude/settings.json",
        ".mcp.json",
        "layer.lock",
      ]
  command: 'echo "Generated by alz: edit .layer/ and run mise run alz:build instead." >&2; exit 2'
  on_fail: deny
# An agent is not done while the Rust checks fail: format, clippy with -D warnings, tests.
- id: verify-on-stop
  event: stop
  command: 'cd "${PROJECT_DIR}" && { cargo fmt --all --check >&2 && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings >&2 && cargo test --workspace --locked >&2; } || exit 2'
  timeout: 600
