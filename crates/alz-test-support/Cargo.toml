[package]
name = "alz-test-support"
version = "0.1.0"
description = "Test helpers for agent-layerz: isolated home, fixture copies, git helpers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# decision-27 (amended 2026-11-24): the pseudo-terminal driver, dev only. This crate is only ever a
# dev-dependency of the others, so the `alz` binary is built without `pty` and `termios`.
# `termios` is for `tcsetpgrp`, which hands the terminal to the child's process group.
rustix = { workspace = true, features = ["pty", "termios"] }
thiserror.workspace = true

[[bin]]
name = "pty-run"
path = "src/bin/pty_run.rs"
