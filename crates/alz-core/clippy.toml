# Twin of crates/alz/clippy.toml. Clippy reads one clippy.toml per crate and does not merge
# them, so the two files repeat what they share and must change together: the four `allow-*-in-tests`
# lines repeat the root clippy.toml, and so does every shared `disallowed-methods` and
# `disallowed-types` entry below.
# This file is the stricter of the two: it also bans the clock and the standard streams, which
# the binary needs.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true

