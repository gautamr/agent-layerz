# Types that open or hold an effect handle. Banning the type also stops a value from being named in a
# signature or a field, which a banned constructor alone would not.
disallowed-types = [
    { path = "std::fs::File", reason = "file system access belongs to alz-io" },
    { path = "std::fs::OpenOptions", reason = "file system access belongs to alz-io" },
    { path = "std::fs::DirBuilder", reason = "file system access belongs to alz-io" },
    { path = "std::process::Command", reason = "running processes belongs to alz-io" },
    { path = "std::net::TcpStream", reason = "networking belongs to alz-io" },
    { path = "std::net::TcpListener", reason = "networking belongs to alz-io" },
    { path = "std::net::UdpSocket", reason = "networking belongs to alz-io" },
]
