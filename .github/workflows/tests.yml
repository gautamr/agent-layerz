name: tests

# The TypeScript reference suite and the language-neutral acceptance suite on Linux (TASK-55.6.16).
# Developers run these on macOS; the Linux-only acceptance cases (a layer file named with the byte
# 0xFF, test 36, TASK-69) are skipped there and run here. They are declared with the platform check
# `process.platform === "linux"`, so on ubuntu-latest they run: against the TypeScript reference
# they are reference-drift cases that must fail (vitest reports them as expected failures).
# Every job runs the same `mise run` tasks a developer runs locally. Nothing here needs a secret.
#
# There is deliberately no `paths:` filter, for the reason given in rust.yml: a skipped workflow
# leaves required checks "Pending".

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede earlier runs of a pull request; never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Each job installs only the tools it needs (install_args), and a missing tool fails the job
  # instead of being fetched silently.
  MISE_AUTO_INSTALL: "false"
  # Locked mode: mise install fails unless mise.lock has a checksummed entry for every tool.
  MISE_LOCKED: "1"
  # The same mise pin as rust.yml (version and sha256 of the extracted linux-x64 binary, from the
  # official release archives). Change it in both workflows together.
  PINNED_MISE_VERSION: "2026.9.1"
  PINNED_MISE_SHA256_LINUX_X64: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea

jobs:
  # mise run test is `vitest run`: the reference project and the acceptance project, with ALZ_BIN
  # unset, so the acceptance suite spawns the TypeScript reference built for the run.
  typescript:
    name: typescript and acceptance (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Node through mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          sha256: ${{ env.PINNED_MISE_SHA256_LINUX_X64 }}
          install_args: node
          cache: false
          persist_github_token: "false"

      # Pull requests restore the npm download cache saved by main and do not save, the same
      # policy as the cargo cache in rust.yml.
      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # --ignore-scripts: no dependency lifecycle script runs in CI.
      - name: Install the npm dependencies
        run: mise exec -- npm ci --ignore-scripts --no-audit --no-fund

      - name: Save the npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: TypeScript reference and acceptance suites
        run: mise run test

  # The acceptance project against the release Rust binary. NOT BLOCKING YET: until R5's commands
  # exist most cases fail. TASK-55.6.15 makes this job blocking (remove continue-on-error there).
  # A job with continue-on-error shows green when its steps fail, but the failures stay in the log
  # and the job's own conclusion is recorded as a failed step: read the log of this job.
  acceptance-rust:
    name: acceptance against the Rust binary (ubuntu, not blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node runs the vitest harness; Rust builds the binary. cache is off for the reason given
      # in rust.yml (mise's Rust is a symlink into rustup's directory).
      - name: Install the pinned Node and Rust toolchain through mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          sha256: ${{ env.PINNED_MISE_SHA256_LINUX_X64 }}
          install_args: node rust
          cache: false
          persist_github_token: "false"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install the npm dependencies
        run: mise exec -- npm ci --ignore-scripts --no-audit --no-fund

      # The typescript job saves the npm cache on main; this job only restores it.

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"

      - name: Build the release alz binary
        run: mise run rust:build

      # ALZ_BIN must be an absolute path. Failures print in full in this step's log.
      - name: Acceptance suite against the Rust binary
        env:
          ALZ_BIN: ${{ github.workspace }}/target/release/alz
        run: mise run test:acceptance
