[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# Equal to the toolchain pinned in mise.toml; both rise together (decision-25).
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/gautamr/agent-layerz"

[workspace.dependencies]
alz-core = { path = "crates/alz-core", version = "0.1.0" }
alz-io = { path = "crates/alz-io", version = "0.1.0" }
alz-test-support = { path = "crates/alz-test-support", version = "0.1.0" }
assert_cmd = "2.2.2"
clap = { version = "4.6.9", features = ["derive"] }
# decision-35: dev-dependency only, with std and without fork, timeout or bit-set.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# decision-27: rustix 1.1.6 or later, called only from alz-io; `fs` for directory-relative access,
# `process` for `setsid` and the process-group kill of the git runner (TASK-55.4.3),
# `termios` for the confirmation prompt of `alz account allow` (amended 2026-11-24, TASK-55.7.11),
# and no other feature until a task needs one. deny.toml keeps the version floor and the caller list.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process", "termios"] }
# decision-32: no derive; alz writes its own visitors. A `[bans]` feature rule in deny.toml keeps it off.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
# decision-33: parse only, into alz's own tree; alz writes JSON with its own emitter. A `[bans]` feature rule in deny.toml keeps the other features off.
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
# decision-38: leak-guard patterns and the secret scan, in alz-core only; std and string, nothing else.
# The pin is repeated in deny.toml.
regex-lite = { version = "=0.1.9", default-features = false, features = ["std", "string"] }
# decision-28: deserialisation only; the pin is repeated in deny.toml.
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
# decision-36: SHA-1 only to compute git's own blob ids; alloc, oid and zeroize stay off.
sha1 = { version = "=0.11.0", default-features = false }
# decision-34: SHA-256 for content hashes and cache names; alloc, oid and zeroize stay off.
sha2 = { version = "=0.11.1", default-features = false }
# decision-31: only std, no anyhow in library crates.
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
# decision-37: NFC only, in alz-core; `std` stays off because alz needs only the iterators.
unicode-normalization = { version = "=0.1.26", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
as_conversions = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
mem_forget = "warn"
wildcard_enum_match_arm = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
undocumented_unsafe_blocks = "warn"
tests_outside_test_module = "warn"
